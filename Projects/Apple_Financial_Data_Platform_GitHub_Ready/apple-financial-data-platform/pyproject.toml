[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-financial-data-platform"
version = "1.0.0"
description = "SEC EDGAR/XBRL to SQL Server ETL and Power BI reporting platform for Apple financial data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Portfolio Project"}]
dependencies = [
  "pandas>=2.2,<3.0",
  "requests>=2.32,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "pyodbc>=5.1,<6.0",
  "python-dotenv>=1.0,<2.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0"
]

[project.scripts]
apple-finance-etl = "apple_financial_etl.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
