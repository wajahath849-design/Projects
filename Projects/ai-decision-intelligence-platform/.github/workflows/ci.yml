name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 30s
    env:
      DB_SERVER: localhost,1433
      DB_DATABASE: AIDecisionIntelligence
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_TRUSTED_CONNECTION: "no"
      DB_TRUST_SERVER_CERTIFICATE: "yes"
      DB_USERNAME: sa
      DB_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Initialize and run sample pipeline
        run: |
          python scripts/initialize_database.py
          python scripts/generate_m5_sample.py
          python scripts/load_m5_data.py --sample
          python scripts/generate_enterprise_data.py --sample
          python scripts/run_data_quality.py
          python scripts/build_features.py
          python scripts/train_models.py
          python scripts/generate_forecasts.py
          python scripts/generate_explanations.py
          python scripts/calculate_inventory_intelligence.py
          python scripts/run_optimization.py
          python scripts/run_scenarios.py
          python scripts/export_power_bi_data.py
      - name: Static checks
        run: |
          python -m ruff check src scripts tests
          python -m mypy src scripts
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider --basetemp .pytest-tmp
