version: 1.0.0
data_policy:
  source: SQLite canonical fact tables
  latest_complete_year: derived from max(power_metrics.timestamp)
  refit_policy: refit from the current database on every forecast request
method:
  name: annual_ordinary_least_squares_linear_trend
  minimum_annual_observations: 4
  uncertainty: approximate_95_prediction_interval
  validation: rolling_origin_backtest_mae_and_r_squared
  caveat: Statistical projection from synthetic historical data; not an observed value, causal conclusion, or guarantee.
supported_metrics:
  average_pue: {aggregation: average, unit: ratio, bounds: [1, 2]}
  power_draw_kw: {aggregation: average, unit: kW, minimum: 0}
  it_load_kw: {aggregation: average, unit: kW, minimum: 0}
  cooling_power_kw: {aggregation: average, unit: kW, minimum: 0}
  cooling_cost: {aggregation: annual_sum, unit: currency_equivalent, minimum: 0}
  cpu_utilization_pct: {aggregation: average, unit: percent, bounds: [0, 100]}
  memory_utilization_pct: {aggregation: average, unit: percent, bounds: [0, 100]}
  disk_utilization_pct: {aggregation: average, unit: percent, bounds: [0, 100]}
  server_network_utilization_pct: {aggregation: average, unit: percent, bounds: [0, 100]}
  bandwidth_utilization_pct: {aggregation: average, unit: percent, bounds: [0, 100]}
  latency_ms: {aggregation: average, unit: milliseconds, minimum: 0}
  packet_loss_pct: {aggregation: average, unit: percent, bounds: [0, 100]}
  throughput_mbps: {aggregation: average, unit: Mbps, minimum: 0}
  network_availability_pct: {aggregation: average, unit: percent, bounds: [0, 100]}
  downtime_minutes: {aggregation: annual_sum, unit: minutes, minimum: 0}
  incident_count: {aggregation: annual_count, unit: incidents, minimum: 0}
unsupported_without_new_history:
  - electricity tariff or energy price
  - hardware purchase price
  - future facility capacity
  - future server inventory count
  - causal incident predictions
