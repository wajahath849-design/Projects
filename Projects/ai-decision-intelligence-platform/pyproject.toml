[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-decision-intelligence-platform"
version = "0.1.0"
description = "Explainable demand forecasting and inventory decision intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "AI Decision Intelligence Platform contributors"}]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "python-dotenv>=1.0.1,<2",
  "SQLAlchemy>=2.0,<3",
  "pyodbc>=5.2,<6",
  "alembic>=1.14,<2",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
data = ["numpy>=2.1,<3", "polars>=1.12,<2", "pyarrow>=18,<21"]
forecasting = ["scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "lightgbm>=4.5,<5", "mlforecast>=0.13,<2", "shap>=0.46,<1", "mlflow>=2.18,<4"]
optimization = ["ortools>=9.11,<10"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1"]

[project.scripts]
decision-intelligence = "decision_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:Using .*httpx.*starlette.testclient.*deprecated:Warning",
  "ignore:builtin type SwigPy.* has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/decision_intelligence/ingestion/database_loader.py" = ["E501"]
"src/decision_intelligence/generation/enterprise_loader.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["decision_intelligence"]

[[tool.mypy.overrides]]
module = "pyodbc"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joblib", "shap"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ortools", "ortools.*"]
ignore_missing_imports = true
