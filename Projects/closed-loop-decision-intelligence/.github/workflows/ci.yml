name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: decision_owner
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: decision_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decision_owner -d decision_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: decision_owner
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: decision_intelligence
      TEST_DATABASE_URL: postgresql+psycopg://decision_owner:ci-test-password@localhost:5432/decision_intelligence
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Check dependencies and Python style
        run: |
          python -m pip check
          python -m ruff check src api scripts tests
      - name: Run tests including PostgreSQL schema integration
        run: python -m pytest --junitxml=data/exports/test-results.xml
      - name: Build and test dbt models against the initialized schema
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Validate Compose configuration
        run: |
          python scripts/configure.py
          docker compose config --quiet
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            data/exports/test-results.xml
            dbt/target/run_results.json
          if-no-files-found: ignore
