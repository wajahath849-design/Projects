[project]
name = "retail-growth-decision-lab"
version = "1.0.0"
description = "Real-data retail analytics, temporal ML evaluation, and campaign decision simulation."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
