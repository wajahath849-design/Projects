version: "1.0"
default_duration_ticks: 18
scenarios:
  cooling_degradation:
    title: Cooling Degradation
    complexity: moderate
    metric_effects:
      cooling_power_kw: {peak_multiplier: 1.42}
      pue: {peak_multiplier: 1.22}
      temperature_c: {peak_addition: 15.0}
    event_code: COOLING_PERFORMANCE_DEGRADED
    alert_metric: pue
    severity: high
  network_congestion:
    title: Network Congestion
    complexity: moderate
    metric_effects:
      latency_ms: {peak_multiplier: 3.4}
      packet_loss_pct: {peak_addition: 2.4}
      bandwidth_utilization_pct: {peak_addition: 30.0}
      throughput_mbps: {peak_multiplier: 0.62}
    event_code: NETWORK_CONGESTION
    alert_metric: latency_ms
    severity: high
  server_overload:
    title: Server Overload
    complexity: moderate
    metric_effects:
      cpu_utilization_pct: {peak_addition: 38.0}
      memory_utilization_pct: {peak_addition: 28.0}
      temperature_c: {peak_addition: 13.0}
    event_code: SERVER_RESOURCE_SATURATION
    alert_metric: cpu_utilization_pct
    severity: high
  power_instability:
    title: Power Instability
    complexity: complex
    metric_effects:
      power_draw_kw: {peak_multiplier: 1.34, oscillation: 0.12}
      availability_pct: {peak_addition: -1.8}
      downtime_minutes: {peak_addition: 2.0}
    event_code: POWER_FEED_UNSTABLE
    alert_metric: power_draw_kw
    severity: critical
  storage_pressure:
    title: Storage Pressure
    complexity: moderate
    metric_effects:
      disk_utilization_pct: {peak_addition: 32.0}
      cpu_utilization_pct: {peak_addition: 12.0}
      latency_ms: {peak_multiplier: 1.45}
    event_code: STORAGE_CAPACITY_PRESSURE
    alert_metric: disk_utilization_pct
    severity: high
  cascading_failure:
    title: Combined Cascading Failure
    complexity: complex
    metric_effects:
      temperature_c: {peak_addition: 18.0}
      pue: {peak_multiplier: 1.25}
      latency_ms: {peak_multiplier: 3.8}
      packet_loss_pct: {peak_addition: 3.2}
      cpu_utilization_pct: {peak_addition: 35.0}
      availability_pct: {peak_addition: -2.5}
      downtime_minutes: {peak_addition: 4.0}
      incident_indicator: {peak_addition: 1.0}
    event_code: MULTI_DOMAIN_DEGRADATION
    alert_metric: availability_pct
    severity: critical
